server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: medguard-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/medguard?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&allowMultiQueries=true&createDatabaseIfNotExist=true
    username: root
    password: medguard123
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    # 生产环境务必通过环境变量 MEDGUARD_JWT_SECRET 覆盖
    secret: ${MEDGUARD_JWT_SECRET:medguard-dev-secret-key-2026-change-me-in-production-please}
    expire-hours: 72
  ai:
    base-url: http://127.0.0.1:8100
    service-key: ${MEDGUARD_SERVICE_KEY:medguard-internal-2026}
    timeout-seconds: 30
  seed:
    dir: ../data
  frontend:
    dir: ../frontend
  privacy:
    # 申报书承诺：用药记录保存至账号注销后 30 天；审计日志保存 6 个月
    account-purge-days: 30
    audit-keep-months: 6

logging:
  level:
    cn.medguard: info
    com.baomidou.mybatisplus: warn

---
# 应急离线演示档（无 MySQL 时用 H2 文件库）：java -jar ... --spring.profiles.active=h2
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/medguard-h2;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: ""
